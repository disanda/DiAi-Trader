<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiAi - 预测竞赛</title>
<link rel="icon" type="image/svg+xml" href="figs/stock.svg">
<link rel="stylesheet" href="assets/css/styles.css?v=4.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--pc-border:#30363d;--pc-panel:#161b22;--pc-panel-2:#0d1117;--pc-text:#e6edf3;--pc-muted:#8b949e;--pc-accent:#58a6ff;--pc-up:#f85149;--pc-down:#3fb950}
.pc-header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.pc-header h2{margin:0;color:var(--pc-text)}.pc-header p{margin:4px 0 0;color:var(--pc-muted);font-size:13px}.pc-refresh{height:34px;border:1px solid #2f81f7;border-radius:6px;background:transparent;color:var(--pc-accent);padding:0 12px;font:inherit;cursor:pointer}.pc-refresh:hover{background:rgba(56,139,253,.12)}
.pc-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.pc-stat{background:var(--pc-panel);border:1px solid var(--pc-border);border-radius:6px;padding:13px 15px}.pc-stat label{display:block;color:var(--pc-muted);font-size:12px;margin-bottom:5px}.pc-stat strong{font-size:22px;color:var(--pc-text)}
.pc-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px}.pc-table-wrap,.pc-detail{border:1px solid var(--pc-border);background:var(--pc-panel-2);border-radius:6px;overflow:hidden}.pc-table{width:100%;border-collapse:collapse}.pc-table th,.pc-table td{padding:12px;text-align:left;border-bottom:1px solid var(--pc-border);font-size:12px}.pc-table th{color:var(--pc-muted);background:var(--pc-panel);font-weight:500}.pc-table tbody tr{cursor:pointer}.pc-table tbody tr:hover,.pc-table tbody tr.active{background:#172235}.pc-table tbody tr:last-child td{border-bottom:none}.pc-table .score{font-weight:600;color:#e6edf3}.pc-rank{display:inline-flex;width:25px;height:25px;align-items:center;justify-content:center;border-radius:50%;background:#30363d;color:#c9d1d9;font-weight:700}.rank-1{background:#b88a2d;color:#fff}.rank-2{background:#718096;color:#fff}.rank-3{background:#8e5b3a;color:#fff}.pc-done{color:var(--pc-down)}.pc-pending{color:#d29922}.pc-up{color:var(--pc-up)}.pc-down{color:var(--pc-down)}
.pc-detail-head{padding:14px;border-bottom:1px solid var(--pc-border)}.pc-detail-head h3{margin:0;font-size:14px;color:var(--pc-text)}.pc-detail-head p{margin:4px 0 0;font-size:11px;color:var(--pc-muted)}.pc-detail-body{padding:14px}.pc-detail-metrics{display:flex;gap:8px;margin-bottom:12px}.pc-detail-metrics span{flex:1;border:1px solid var(--pc-border);border-radius:5px;padding:9px;color:var(--pc-muted);font-size:11px}.pc-detail-metrics b{display:block;margin-top:4px;color:var(--pc-text);font-size:16px}.pc-prediction-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;width:100%;padding:9px 0;border:0;border-bottom:1px solid var(--pc-border);background:transparent;color:#c9d1d9;text-align:left;font:inherit;font-size:11px;cursor:pointer}.pc-prediction-item:hover,.pc-prediction-item.active{background:#172235}.pc-prediction-item small{display:block;color:var(--pc-muted);margin-top:2px}.pc-detail-focus{margin-top:15px;border-top:1px solid var(--pc-border);padding-top:14px}.pc-detail-focus h4{margin:0;color:var(--pc-text);font-size:14px}.pc-detail-focus>p{margin:4px 0 13px;color:var(--pc-muted);font-size:11px}.pc-detail-item{margin:12px 0}.pc-detail-item label{display:block;color:var(--pc-muted);font-size:11px;margin-bottom:4px}.pc-detail-item p{margin:0;color:#c9d1d9;font-size:12px;line-height:1.7;white-space:pre-wrap}.pc-empty{min-height:330px;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;color:var(--pc-muted);font-size:13px;line-height:1.8}.pc-notice{margin-top:16px;color:#7d8590;font-size:12px;line-height:1.7}
.pc-detail-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.pc-detail-title label{display:flex;align-items:center;gap:6px;color:var(--pc-muted);font-size:11px;white-space:nowrap}.pc-detail-title select{height:30px;border:1px solid var(--pc-border);border-radius:5px;background:var(--pc-panel);color:var(--pc-text);padding:0 7px;font:inherit;font-size:11px}.pc-run-meta{margin:0 0 10px;color:var(--pc-muted);font-size:11px}
@media(max-width:900px){.pc-layout{grid-template-columns:1fr}.pc-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.pc-header{align-items:start;flex-direction:column}.pc-table-wrap{overflow:auto}.pc-table{min-width:720px}}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container"><div class="nav-brand"><span class="brand-icon"><i class="ti ti-chart-candle"></i></span><h1>DiAi-自交易系统</h1></div><ul class="nav-menu"><li><a href="index.html" class="nav-link">行情展示</a></li><li><a href="portfolio.html" class="nav-link">持仓分析</a></li><li><a href="choose_stock.html" class="nav-link">标的管理</a></li><li><a href="run_agent.html" class="nav-link">运行智能体</a></li><li><a href="prompt.html" class="nav-link">提示词管理</a></li><li><a href="market-display.html" class="nav-link">A股大盘</a></li><li><a href="predict-competition.html" class="nav-link active">预测竞赛</a></li></ul></div></nav>
<main class="container">
<header class="pc-header"><div><h2>预测竞赛 · 排行榜</h2><p id="pcMeta">加载预测和验证结果中</p></div><button class="pc-refresh" type="button" onclick="loadCompetition()"><i class="ti ti-refresh"></i> 刷新结果</button></header>
<section class="pc-summary"><div class="pc-stat"><label>参赛智能体</label><strong id="pcAgents">--</strong></div><div class="pc-stat"><label>测试批次</label><strong id="pcRuns">--</strong></div><div class="pc-stat"><label>已验证预测</label><strong id="pcVerified">--</strong></div><div class="pc-stat"><label>最新预测日</label><strong id="pcDate">--</strong></div></section>
<section class="pc-layout"><main class="pc-detail" id="pcDetail"><div class="pc-empty">点击右侧排行榜中的智能体查看预测详情</div></main><aside class="pc-table-wrap" id="pcLeaderboard"><div class="pc-empty">正在加载排行榜...</div></aside></section>
<p class="pc-notice">排行榜只统计已存在实际交易数据的预测；目标日尚未到达的项目会标记为“待验证”。点击智能体后可查看每个指数的预测、实际结果、正确性和分析依据。</p>
</main>
<script src="assets/js/predict-competition.js?v=20260824"></script>
</body>
</html>
